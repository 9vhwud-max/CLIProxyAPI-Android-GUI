# Conservative defaults for Windows/JBR builds. build-all.ps1 also uses
# --no-daemon so a stale daemon cannot poison later runs.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.vfs.watch=false
org.gradle.internal.instrumentation.agent=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# Base shell version. GitHub Actions may override these per upstream bundle.
cpa.shellVersionName=0.3.1
cpa.shellVersionCode=4
